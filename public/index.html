<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>台灣上空衛星</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js"></script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="labels" aria-hidden="true"></div>

  <header class="bar">
    <h1>台灣上空衛星 <span id="version"></span></h1>
    <time id="clock"></time>
    <div class="segmented" role="group" aria-label="視角">
      <button data-view="space" type="button">太空俯瞰</button>
      <button data-view="sky" type="button">台灣仰望</button>
    </div>
    <button id="reset" type="button">重置視角</button>
    <div class="starlink">
      <button id="starlink-toggle" type="button" aria-pressed="false" title="顯示星鏈（Starlink）全部衛星">星鏈 Starlink</button>
      <span id="starlink-info" hidden></span>
    </div>
    <div class="sim">
      <button id="sim-toggle" type="button" aria-pressed="false">加速模擬</button>
      <input id="sim-speed" type="range" min="1" max="200" step="1" value="10" aria-label="模擬倍速" hidden>
      <output id="sim-rate" for="sim-speed" hidden>10×</output>
    </div>
  </header>

  <aside id="panel">
    <div class="segmented tabs" role="tablist" aria-label="面板">
      <button type="button" role="tab" data-tab="list" aria-selected="true" class="active">追蹤清單</button>
      <button type="button" role="tab" data-tab="passes" aria-selected="false">過境預報</button>
    </div>
    <section id="tab-list" class="tab" role="tabpanel">
      <p class="tab-head"><span id="count"></span></p>
      <ul id="list"></ul>
      <form id="add">
        <input id="add-id" inputmode="numeric" pattern="[0-9]{1,6}" placeholder="NORAD 編號" aria-label="NORAD 編號" required>
        <button type="submit">加入</button>
      </form>
      <p id="quota"></p>
    </section>
    <section id="tab-passes" class="tab" role="tabpanel" hidden>
      <div class="tab-head">
        <span id="pass-status"></span>
        <label class="check"><input type="checkbox" id="visible-only"> 只看肉眼可見</label>
      </div>
      <ul id="passes"></ul>
      <p class="note">未來 3 天、最高仰角 10° 以上，台灣時間。點一下會從過境前 1 分鐘開始模擬。</p>
    </section>
  </aside>

  <p id="hint"></p>
  <div id="notice" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
