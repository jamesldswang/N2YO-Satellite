<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>台灣上空衛星</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/satellite.js@5.0.0/dist/satellite.min.js"></script>
</head>
<body>
  <canvas id="scene"></canvas>
  <div id="labels" aria-hidden="true"></div>

  <header class="bar collapsed" id="bar">
    <button id="settings-toggle" type="button" aria-expanded="false" aria-controls="bar-tools" title="顯示／隱藏設定按鈕">⚙ 設定</button>
    <h1>台灣上空衛星 <span id="version"></span></h1>
    <time id="clock"></time>
    <div id="bar-tools">
    <div class="segmented" role="group" aria-label="視角">
      <button data-view="space" type="button">太空俯瞰</button>
      <button data-view="sky" type="button">台灣仰望</button>
    </div>
    <button id="reset" type="button">重置視角</button>
    <div class="starlink">
      <button id="starlink-toggle" type="button" aria-pressed="false" title="顯示星鏈（Starlink）全部衛星">星鏈 Starlink</button>
      <span id="starlink-info" hidden></span>
    </div>
    <div class="starlink">
      <button id="clouds-toggle" type="button" aria-pressed="false" title="顯示中央氣象署的向日葵衛星紅外線雲圖（每 10 分鐘更新）">衛星雲圖</button>
      <span id="clouds-info" hidden></span>
    </div>
    <div class="starlink">
      <button id="weather-toggle" type="button" aria-pressed="false" title="顯示中央氣象署約 360 個測站的即時氣溫（點的顏色）和風（箭頭往下風處，越長風越大）">溫度／風</button>
      <span id="weather-legend" hidden><span>0°</span><i></i><span>35°C</span></span>
      <span id="weather-info" hidden></span>
    </div>
    <div class="starlink">
      <span class="body-name" title="從台灣看的太陽仰角和方位">太陽</span>
      <span id="sun-info"></span>
    </div>
    <div class="starlink">
      <span class="body-name" title="月亮在真實位置（約 38 萬公里外），亮面跟著太陽方向，看得出月相；這裡顯示從台灣看的仰角、方位和月相">月亮</span>
      <span id="moon-info"></span>
    </div>
    <button id="solar-toggle" type="button" aria-pressed="false" title="太陽系示意：太陽在中心，八大行星和月亮的方向是真的（JPL 軌道根數），距離開根號縮放、大小放大。會自動開 10 萬倍加速模擬（地球約 5 分鐘繞太陽一圈），倍速最高 100 萬倍">太陽系</button>
    <button id="spin-toggle" type="button" aria-pressed="false" title="改用太空固定的視角：星空和軌道平面不動，看到地球在底下自轉（每小時 15°，所以會自動開 200 倍加速模擬）。軌道線會變成閉合的橢圓">地球自轉</button>
    <button id="grid-toggle" type="button" aria-pressed="false" title="顯示經緯線（每 15° 一條虛線，赤道和本初子午線較亮）">經緯線</button>
    <button id="replay-toggle" type="button" disabled>回放</button>
    <div class="sim">
      <button id="sim-toggle" type="button" aria-pressed="false">加速模擬</button>
      <input id="sim-speed" type="range" min="0" max="1000" step="1" value="250" aria-label="模擬倍速（對數刻度，1–10000 倍）" hidden>
      <output id="sim-rate" for="sim-speed" hidden>10×</output>
    </div>
    </div>
  </header>

  <button id="panel-toggle" type="button" aria-expanded="true" aria-controls="panel" title="收起衛星清單">&gt;</button>
  <aside id="panel">
    <div class="segmented tabs" role="tablist" aria-label="面板">
      <button type="button" role="tab" data-tab="list" aria-selected="true" class="active">追蹤清單</button>
      <button type="button" role="tab" data-tab="passes" aria-selected="false">過境預報</button>
    </div>
    <section id="tab-list" class="tab" role="tabpanel">
      <p class="tab-head"><span id="count"></span></p>
      <ul id="list"></ul>
      <form id="add">
        <input id="add-id" placeholder="NORAD 編號或名稱" aria-label="NORAD 編號或名稱" autocomplete="off" required
          role="combobox" aria-controls="add-menu" aria-expanded="false" aria-autocomplete="list">
        <button type="submit">加入</button>
        <ul id="add-menu" role="listbox" aria-label="還沒追蹤的衛星" hidden></ul>
      </form>
      <p id="quota"></p>
    </section>
    <section id="tab-passes" class="tab" role="tabpanel" hidden>
      <div class="tab-head">
        <span id="pass-status"></span>
        <label class="check"><input type="checkbox" id="visible-only"> 只看肉眼可見</label>
      </div>
      <ul id="passes"></ul>
      <p class="note">未來 3 天、最高仰角 10° 以上，台灣時間。點一下會從過境前 1 分鐘開始模擬。</p>
    </section>
  </aside>

  <div id="replay-bar" hidden>
    <button id="replay-play" type="button">⏸ 暫停</button>
    <input id="replay-pos" type="range" aria-label="回放時間">
    <output id="replay-time" for="replay-pos"></output>
    <select id="replay-speed" aria-label="回放倍速">
      <option value="60">60×</option>
      <option value="300">300×</option>
      <option value="600" selected>600×</option>
      <option value="1800">1800×</option>
    </select>
    <button id="replay-exit" type="button">結束回放</button>
  </div>

  <p id="altitude"></p>
  <p id="hint"></p>
  <p id="credit" hidden><a target="_blank" rel="noopener"></a></p>
  <div id="notice" hidden></div>

  <script type="module" src="app.js"></script>
</body>
</html>
